<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 游戏决策机 · Game Picker</title>
<meta name="description" content="为小朋友随机推荐一件好玩的事 · Pick a fun activity to do.">
<meta name="theme-color" content="#FFB6A3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Picker">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="confetti-layer" aria-hidden="true"></div>

<header class="topbar">
  <div class="logo">
    <span class="logo-emoji clay-orb">🧸</span>
    <span class="logo-text" id="logo-text">游戏决策机</span>
  </div>
  <nav class="tabs" aria-label="主导航">
    <button class="tab active" data-view="recommend" aria-current="page" id="tab-recommend">🎲 推荐</button>
    <button class="tab" data-view="library" id="tab-library">📦 活动库</button>
  </nav>
  <div class="topbar-actions">
    <button class="icon-btn" id="open-settings" title="设置">⚙️</button>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<main class="main">

  <!-- ============ 推荐 / 抽签视图 ============ -->
  <section id="view-recommend" class="view active">
    <div class="greeting">
      <div class="mascot clay-orb">🐰</div>
      <div>
        <h1 id="greeting-text">今天玩什么呀？</h1>
        <p class="subtitle" id="greeting-subtitle">点一下大按钮，帮你挑一件好玩的事～</p>
      </div>
    </div>

    <div class="hero">
      <button id="pick-btn" class="clay-btn hero-btn" aria-label="开始抽取">
        <span class="hero-btn-main" id="pick-main">开始</span>
        <span class="hero-btn-sub" id="pick-sub">点我抽一个</span>
      </button>
    </div>

    <div class="filters">
      <div class="filters-top">
        <button id="toggle-filters" class="clay-chip" type="button">🎛️ <span id="filter-label">筛选</span></button>
        <label class="pure-random clay-chip">
          <input type="checkbox" id="pure-random">
          <span>🎲 纯随机</span>
        </label>
      </div>
      <div id="filter-panel" class="filter-panel" hidden>
        <div class="filter-group">
          <span class="filter-label" id="category-label">类别</span>
          <div id="filter-categories" class="chips"></div>
        </div>
        <div class="filter-actions">
          <button id="clear-filters" class="clay-btn small" type="button">清除筛选</button>
        </div>
      </div>
    </div>

    <div id="empty-pool" class="empty-pool" hidden>
      <p id="empty-pool-text">😯 没有符合条件的活动，试试放宽筛选～</p>
      <button id="clear-filters-2" class="clay-btn small" type="button">清除筛选</button>
    </div>

    <div id="result-area" hidden>
      <div id="result-card" class="result-card">
        <div class="result-emoji clay-orb" id="result-emoji">🎉</div>
        <h2 id="result-name"></h2>
        <div class="result-meta" id="result-meta"></div>
        <p class="result-desc" id="result-desc"></p>
        <p class="result-materials" id="result-materials"></p>
        <div class="result-actions">
          <button id="reroll-btn" class="clay-btn">🔄 换一个</button>
          <button id="confirm-btn" class="clay-btn primary">👍 就玩这个！</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 活动库 / 管理视图 ============ -->
  <section id="view-library" class="view">
    <button class="clay-btn primary lib-add-btn" id="open-form">➕ 添加活动</button>
    <div class="stats" id="stats"></div>
    <div id="recent-plays" class="recent-plays" hidden>
      <div class="recent-title">🕘 最近玩过</div>
      <div id="recent-list" class="recent-list"></div>
    </div>
    <div class="library-tools">
      <input type="search" id="search" class="clay-input grow" placeholder="🔍 搜索活动...">
      <select id="sort" class="clay-select" style="max-width: 130px;">
        <option value="recent" id="sort-recent">最近添加</option>
        <option value="name" id="sort-name">按名称</option>
        <option value="favorite" id="sort-favorite">最爱优先</option>
      </select>
    </div>
    <div id="lib-categories" class="chips"></div>
    <div id="activity-grid" class="card-grid"></div>
    <div id="lib-empty" class="empty-pool" hidden>
      <p id="lib-empty-text">📭 还没有活动，点「添加活动」录入第一件吧～</p>
    </div>
  </section>

</main>

<!-- ============ 活动表单弹窗 ============ -->
<div class="modal-backdrop" id="form-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="form-title">➕ 添加活动</h2>
      <button class="icon-btn modal-close" data-close="form-modal" aria-label="关闭">✕</button>
    </div>
    <form id="activity-form" novalidate>
      <input type="hidden" id="f-id">
      <div class="form-row name-icon">
        <div class="emoji-pick">
          <button type="button" id="emoji-trigger" class="emoji-trigger" title="选择图标">🧸</button>
          <div id="emoji-pop" class="emoji-pop" hidden></div>
        </div>
        <input type="text" id="f-name" class="clay-input" placeholder="活动名称（例如：磁力片搭城堡）" maxlength="60" aria-label="中文名称" required>
      </div>
      <div class="form-row">
        <label class="field"><span id="form-category-label">类别</span>
          <select id="f-category" class="clay-select"></select>
        </label>
      </div>
      <label class="field"><span id="form-name-en-label">English name</span>
        <input type="text" id="f-name-en" class="clay-input" placeholder="English activity name" maxlength="80" required>
      </label>
      <label class="field"><span id="form-desc-zh-label">玩法说明</span>
        <textarea id="f-desc" class="clay-input" rows="3" placeholder="怎么玩、有什么小目标..."></textarea>
      </label>
      <label class="field"><span id="form-desc-en-label">English instructions</span>
        <textarea id="f-desc-en" class="clay-input" rows="3" placeholder="How to play..."></textarea>
      </label>
      <label class="field"><span id="form-materials-zh-label">需要的材料</span>
        <input type="text" id="f-materials" class="clay-input" placeholder="例如：磁力片、纸盘、彩笔（可留空）">
      </label>
      <label class="field"><span id="form-materials-en-label">English materials</span>
        <input type="text" id="f-materials-en" class="clay-input" placeholder="Materials (optional)">
      </label>
      <label class="favorite-check clay-chip">
        <input type="checkbox" id="f-favorite">
        <span id="form-favorite-label">⭐ 加入最爱</span>
      </label>
      <div class="form-actions">
        <button type="button" class="clay-btn" data-close="form-modal" id="form-cancel">取消</button>
        <button type="submit" class="clay-btn primary" id="form-save">💾 保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 设置弹窗 ============ -->
<div class="modal-backdrop" id="settings-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="settings-title">⚙️ 设置</h2>
      <button class="icon-btn modal-close" data-close="settings-modal" aria-label="关闭">✕</button>
    </div>
    <div class="settings-body">
      <label class="field"><span id="settings-name-label">我的名字</span>
        <input type="text" id="s-name" class="clay-input" placeholder="小朋友">
      </label>
      <label class="field"><span id="settings-avoid-label">连续推荐时避开最近几个（1–10）</span>
        <input type="number" id="s-avoid" class="clay-input" min="1" max="10" step="1">
      </label>
      <label class="clay-chip voice-check">
        <input type="checkbox" id="s-voice">
        <span id="settings-voice-label">🔊 语音播报结果</span>
      </label>
      <label class="field"><span id="settings-language-label">语言 / Language</span>
        <select id="s-language" class="clay-select">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
      </label>
      <button type="button" id="voice-test" class="clay-btn small">🔊 试听当前语言</button>
      <div class="install-help">
        <h3 id="install-title">📱 添加到桌面</h3>
        <p id="install-note">请使用 http:// 或 https:// 网址访问；直接打开 file:// 文件不能完整安装。</p>
        <details>
          <summary id="install-ios-summary">iPhone / iPad Safari</summary>
          <ol id="install-ios-steps"></ol>
        </details>
        <details>
          <summary id="install-android-summary">Android Chrome</summary>
          <ol id="install-android-steps"></ol>
        </details>
      </div>
      <div class="settings-actions">
        <button type="button" id="export-btn" class="clay-btn small">📤 导出备份</button>
        <button type="button" id="import-btn" class="clay-btn small">📥 导入备份</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <div class="settings-actions danger">
        <button type="button" id="reset-sample" class="clay-btn small">🧪 恢复示例数据</button>
        <button type="button" id="clear-all" class="clay-btn small danger">🗑️ 清空全部数据</button>
      </div>
      <div class="form-actions">
        <button type="button" class="clay-btn" data-close="settings-modal" id="settings-cancel">取消</button>
        <button type="button" id="save-settings" class="clay-btn primary">💾 保存设置</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 通用确认弹窗 ============ -->
<div class="modal-backdrop" id="confirm-modal" hidden>
  <div class="modal modal-sm">
    <div class="modal-head">
      <h2 id="confirm-title">确认</h2>
    </div>
    <p id="confirm-message" class="confirm-message"></p>
    <div class="form-actions">
      <button type="button" class="clay-btn" id="confirm-cancel">取消</button>
      <button type="button" class="clay-btn danger" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/storage.js"></script>
<script src="js/recommend.js"></script>
<script src="js/app.js"></script>
</body>
</html>
