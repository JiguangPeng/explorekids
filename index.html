<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 游戏决策机 · 今天玩什么</title>
<meta name="description" content="为小朋友录下家里好玩的事，点一下大按钮，随机推荐一件来做。">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="confetti-layer" aria-hidden="true"></div>

<header class="topbar">
  <div class="logo">
    <span class="logo-emoji clay-orb">🧸</span>
    <span class="logo-text">游戏决策机</span>
  </div>
  <nav class="tabs" aria-label="主导航">
    <button class="tab active" data-view="recommend" aria-current="page">🎲 推荐</button>
    <button class="tab" data-view="library">📦 活动库</button>
  </nav>
  <div class="topbar-actions">
    <button class="icon-btn" id="open-settings" title="设置">⚙️</button>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<main class="main">

  <!-- ============ 推荐 / 抽签视图 ============ -->
  <section id="view-recommend" class="view active">
    <div class="greeting">
      <div class="mascot clay-orb">🐰</div>
      <div>
        <h1 id="greeting-text">今天玩什么呀？</h1>
        <p class="subtitle">点一下大按钮，帮你挑一件好玩的事～</p>
      </div>
    </div>

    <div class="hero">
      <button id="pick-btn" class="clay-btn hero-btn" aria-label="开始抽取">
        <span class="hero-btn-main">开始</span>
        <span class="hero-btn-sub">点我抽一个</span>
      </button>
    </div>

    <div class="filters">
      <div class="filters-top">
        <button id="toggle-filters" class="clay-chip" type="button">🎛️ 筛选</button>
        <label class="pure-random clay-chip">
          <input type="checkbox" id="pure-random">
          <span>🎲 纯随机</span>
        </label>
      </div>
      <div id="filter-panel" class="filter-panel" hidden>
        <div class="filter-group">
          <span class="filter-label">类别</span>
          <div id="filter-categories" class="chips"></div>
        </div>
        <div class="filter-row">
          <label class="field">时长
            <select id="f-duration" class="clay-select">
              <option value="">不限</option>
              <option value="short">短（≤15 分钟）</option>
              <option value="medium">中（15–30 分钟）</option>
              <option value="long">长（>30 分钟）</option>
            </select>
          </label>
          <label class="field">精力
            <select id="f-energy" class="clay-select">
              <option value="">不限</option>
              <option value="安静">😌 安静</option>
              <option value="适中">🙂 适中</option>
              <option value="活跃">🤸 活跃</option>
            </select>
          </label>
          <label class="field">人数
            <select id="f-players" class="clay-select">
              <option value="">不限</option>
              <option value="独自">🙋 独自</option>
              <option value="亲子">💞 亲子</option>
              <option value="多人">👪 多人</option>
            </select>
          </label>
          <label class="field">室内外
            <select id="f-indoor" class="clay-select">
              <option value="">不限</option>
              <option value="室内">🏠 室内</option>
              <option value="户外">🌳 户外</option>
              <option value="皆可">🌈 皆可</option>
            </select>
          </label>
        </div>
        <div class="filter-actions">
          <button id="clear-filters" class="clay-btn small" type="button">清除筛选</button>
        </div>
      </div>
    </div>

    <div id="empty-pool" class="empty-pool" hidden>
      <p>😯 没有符合条件的活动，试试放宽筛选～</p>
      <button id="clear-filters-2" class="clay-btn small" type="button">清除筛选</button>
    </div>

    <div id="result-area" hidden>
      <div id="result-card" class="result-card">
        <div class="result-emoji clay-orb" id="result-emoji">🎉</div>
        <h2 id="result-name"></h2>
        <div class="result-meta" id="result-meta"></div>
        <p class="result-desc" id="result-desc"></p>
        <p class="result-materials" id="result-materials"></p>
        <div class="result-actions">
          <button id="reroll-btn" class="clay-btn">🔄 换一个</button>
          <button id="confirm-btn" class="clay-btn primary">👍 就玩这个！</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 活动库 / 管理视图 ============ -->
  <section id="view-library" class="view">
    <button class="clay-btn primary lib-add-btn" id="open-form">➕ 添加活动</button>
    <div class="stats" id="stats"></div>
    <div class="library-tools">
      <input type="search" id="search" class="clay-input grow" placeholder="🔍 搜索活动...">
      <select id="sort" class="clay-select" style="max-width: 130px;">
        <option value="recent">最近添加</option>
        <option value="name">按名称</option>
        <option value="duration">按时长</option>
        <option value="favorite">最爱优先</option>
      </select>
    </div>
    <div id="lib-categories" class="chips"></div>
    <div id="activity-grid" class="card-grid"></div>
    <div id="lib-empty" class="empty-pool" hidden>
      <p>📭 还没有活动，点「添加活动」录入第一件吧～</p>
    </div>
  </section>

</main>

<!-- ============ 活动表单弹窗 ============ -->
<div class="modal-backdrop" id="form-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="form-title">➕ 添加活动</h2>
      <button class="icon-btn modal-close" data-close="form-modal" aria-label="关闭">✕</button>
    </div>
    <form id="activity-form" novalidate>
      <input type="hidden" id="f-id">
      <div class="form-row name-icon">
        <div class="emoji-pick">
          <button type="button" id="emoji-trigger" class="emoji-trigger" title="选择图标">🧸</button>
          <div id="emoji-pop" class="emoji-pop" hidden></div>
        </div>
        <input type="text" id="f-name" class="clay-input" placeholder="活动名称（例如：磁力片搭城堡）" maxlength="60" aria-label="活动名称" required>
      </div>
      <div class="form-row">
        <label class="field">类别
          <select id="f-category" class="clay-select"></select>
        </label>
        <label class="field">时长（分钟）
          <input type="number" id="f-duration-min" class="clay-input" min="1" max="1000" step="1" placeholder="选填">
        </label>
      </div>
      <fieldset class="seg-group">
        <legend>精力</legend>
        <div class="segmented" id="f-energy-seg"></div>
      </fieldset>
      <fieldset class="seg-group">
        <legend>人数</legend>
        <div class="segmented" id="f-players-seg"></div>
      </fieldset>
      <fieldset class="seg-group">
        <legend>室内外</legend>
        <div class="segmented" id="f-indoor-seg"></div>
      </fieldset>
      <label class="field">玩法说明
        <textarea id="f-desc" class="clay-input" rows="3" placeholder="怎么玩、有什么小目标..."></textarea>
      </label>
      <label class="field">需要的材料
        <input type="text" id="f-materials" class="clay-input" placeholder="例如：磁力片、纸盘、彩笔（可留空）">
      </label>
      <label class="field">标签（用逗号分开）
        <input type="text" id="f-tags" class="clay-input" placeholder="例如：动手, 安静, 室内">
      </label>
      <label class="favorite-check clay-chip">
        <input type="checkbox" id="f-favorite">
        <span>⭐ 加入最爱</span>
      </label>
      <div class="form-actions">
        <button type="button" class="clay-btn" data-close="form-modal">取消</button>
        <button type="submit" class="clay-btn primary">💾 保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 设置弹窗 ============ -->
<div class="modal-backdrop" id="settings-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>⚙️ 设置</h2>
      <button class="icon-btn modal-close" data-close="settings-modal" aria-label="关闭">✕</button>
    </div>
    <div class="settings-body">
      <label class="field">我的名字
        <input type="text" id="s-name" class="clay-input" placeholder="派派">
      </label>
      <label class="field">连续推荐时避开最近几个（1–10）
        <input type="number" id="s-avoid" class="clay-input" min="1" max="10" step="1">
      </label>
      <div class="field">
        <span class="filter-label">类别管理</span>
        <div id="category-list" class="category-list"></div>
        <button type="button" id="add-category" class="clay-btn small">➕ 新增类别</button>
      </div>
      <div class="settings-actions">
        <button type="button" id="export-btn" class="clay-btn small">📤 导出备份</button>
        <button type="button" id="import-btn" class="clay-btn small">📥 导入备份</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <div class="settings-actions danger">
        <button type="button" id="reset-sample" class="clay-btn small">🧪 恢复示例数据</button>
        <button type="button" id="clear-all" class="clay-btn small danger">🗑️ 清空全部数据</button>
      </div>
      <div class="form-actions">
        <button type="button" class="clay-btn" data-close="settings-modal">取消</button>
        <button type="button" id="save-settings" class="clay-btn primary">💾 保存设置</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 通用确认弹窗 ============ -->
<div class="modal-backdrop" id="confirm-modal" hidden>
  <div class="modal modal-sm">
    <div class="modal-head">
      <h2 id="confirm-title">确认</h2>
    </div>
    <p id="confirm-message" class="confirm-message"></p>
    <div class="form-actions">
      <button type="button" class="clay-btn" id="confirm-cancel">取消</button>
      <button type="button" class="clay-btn danger" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/storage.js"></script>
<script src="js/recommend.js"></script>
<script src="js/app.js"></script>
</body>
</html>
