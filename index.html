<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>探索派 · 亲子周末</title><meta name="description" content="探索派：玩一玩、聊聊天、去哪里"><meta name="theme-color" content="#FFB6A3">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="confetti-layer" aria-hidden="true"></div>
<header class="topbar"><div class="brand-row"><div class="logo"><span class="logo-mark">🧭</span><span class="logo-text">探索派</span></div><span class="brand-slogan">一起玩，一起聊，周末去探索</span></div><div class="nav-row"><nav class="tabs" aria-label="主导航"><button class="tab active" data-view="play">🧸 玩一玩</button><button class="tab" data-view="chat">💬 聊聊天</button><button class="tab" data-view="outing">🧭 去哪里</button></nav><button class="icon-btn settings-btn" id="open-settings" title="设置" aria-label="设置">⚙️</button></div></header>
<div class="banner" id="banner" hidden></div>
<main class="main">
<section id="view-play" class="view active"><div class="module-head"><div class="greeting"><div class="mascot clay-orb">🧸</div><div><h1>现在玩什么？</h1><p class="subtitle">点一下，让探索派帮你挑一个亲子活动～</p></div></div></div><div class="hero"><button id="play-pick" class="clay-btn hero-btn"><span class="hero-btn-main">开始</span><span class="hero-btn-sub">点我抽一个</span></button></div><div class="module-tools"><div class="tool-left"><button class="clay-chip" data-toggle="play-filter">🎛️ <span>筛选</span><span class="filter-summary" id="play-summary">全部</span></button></div><button class="clay-btn small manage-trigger" data-manage="play">管理</button></div><div class="filter-panel" id="play-filter" hidden><div id="play-categories" class="chips"></div></div><div id="play-result" hidden></div></section>
<section id="view-chat" class="view"><div class="module-head"><div class="chat-greeting"><div class="chat-mascot clay-orb">💬</div><div><h1>我们聊点什么呢？</h1><p class="subtitle">没有标准答案，认真听彼此说就很好～</p></div></div></div><div class="module-tools"><div class="tool-left"><button id="chat-filter-toggle" class="clay-chip">🎯 <span>选择话题</span><span class="filter-summary" id="chat-selected">全部</span></button></div><button class="clay-btn small manage-trigger" data-manage="chat">🛠️ 管理</button></div><div id="chat-filter-panel" class="filter-panel" hidden><div id="chat-categories" class="chips"></div></div><div class="chat-pick-area"><button id="chat-pick" class="clay-btn chat-pick-btn"><span class="chat-pick-emoji">🎴</span>抽一张聊天卡</button></div><article id="chat-card" class="chat-card" hidden><div class="chat-card-top"><div id="chat-emoji" class="chat-card-emoji clay-orb">💬</div><div id="chat-badge" class="chat-topic-badge"></div></div><div id="chat-prompt" class="chat-prompt"></div><div id="chat-followups" class="chat-followups"></div><div id="chat-fact" class="chat-fact" hidden></div><div class="chat-card-actions"><button id="chat-answer" class="clay-btn" hidden>💡 查看答案</button><button id="chat-reroll" class="clay-btn primary">🔄 换一个</button></div></article></section>
<section id="view-outing" class="view"><div class="module-head"><div class="greeting"><div class="mascot clay-orb">🧭</div><div><h1>周末去哪里？</h1><p class="subtitle">先从深圳市内和周边，挑一个轻松去处～</p></div></div></div><div class="outing-hero"><button id="outing-pick" class="clay-btn hero-btn"><span class="hero-btn-main">出发</span><span class="hero-btn-sub">帮我选个地方</span></button></div><div class="module-tools"><div class="tool-left"><button id="outing-filter-toggle" class="clay-chip">🎛️ <span>筛选</span><span class="filter-summary" id="outing-summary">全部</span></button></div><button class="clay-btn small manage-trigger" data-manage="outing">🛠️ 管理</button></div><div id="outing-filter-panel" class="filter-panel" hidden><div id="outing-region" class="chips"></div><div id="outing-categories" class="chips"></div><div class="filter-row"><select id="outing-indoor" class="clay-select"><option value="">室内/室外不限</option><option>室内</option><option>室外</option></select><select id="outing-duration" class="clay-select"><option value="">时长不限</option><option value="2">2小时左右</option><option value="半天">半天</option><option value="一天">一天</option><option value="1–2天">1–2天</option></select></div></div><div id="outing-result" hidden></div></section>
</main>
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div><aside class="library-drawer" id="library-drawer" aria-hidden="true"><div class="drawer-head"><h2 id="drawer-title">管理库</h2><button class="icon-btn" id="drawer-close" aria-label="关闭">✕</button></div><div id="drawer-content"></div></aside>
<div class="modal-backdrop" id="item-modal" hidden><div class="modal"><div class="modal-head"><h2 id="modal-title">新增内容</h2><button class="icon-btn" data-close="item-modal">✕</button></div><form id="item-form"><input type="hidden" id="item-id"><input type="hidden" id="item-module"><label class="field">名称<input id="item-name" class="clay-input" required></label><label class="field">English name<input id="item-name-en" class="clay-input"></label><label class="field">分类<select id="item-category" class="clay-select"></select></label><label class="field">Emoji<input id="item-emoji" class="clay-input" value="🎈"></label><label class="field">说明<textarea id="item-desc" class="clay-input" rows="3"></textarea></label><div id="outing-fields" hidden><label class="field">区域<input id="item-area" class="clay-input"></label><label class="field">深圳市内 / 深圳周边<select id="item-region" class="clay-select"><option>深圳市内</option><option>深圳周边</option></select></label><label class="field">室内/室外<input id="item-indoor" class="clay-input"></label><label class="field">适合年龄<input id="item-age" class="clay-input"></label><label class="field">建议时长<input id="item-duration" class="clay-input"></label><label class="field">亲子亮点<textarea id="item-highlights" class="clay-input" rows="2"></textarea></label><label class="field">注意事项<textarea id="item-notes" class="clay-input" rows="2"></textarea></label><label class="field">地图搜索名称<input id="item-map" class="clay-input"></label></div><label class="favorite-check clay-chip"><input type="checkbox" id="item-favorite"><span>⭐ 加入最爱</span></label><div class="form-actions"><button type="button" class="clay-btn" data-close="item-modal">取消</button><button type="submit" class="clay-btn primary">💾 保存</button></div></form></div></div>
<div class="modal-backdrop" id="settings-modal" hidden><div class="modal"><div class="modal-head"><h2>⚙️ 设置</h2><button class="icon-btn" data-close="settings-modal">✕</button></div><label class="field">我的名字<input id="s-name" class="clay-input"></label><label class="clay-chip voice-check"><input type="checkbox" id="s-voice"><span>🔊 语音播报结果</span></label><label class="field">语言<select id="s-language" class="clay-select"><option value="zh-CN">中文</option><option value="en-US">English</option></select></label><button id="voice-test" class="clay-btn small">🔊 试听</button><div class="form-actions"><button class="clay-btn" data-close="settings-modal">取消</button><button id="save-settings" class="clay-btn primary">💾 保存</button></div></div></div><div id="toast" class="toast" hidden></div>
<script src="js/chat-data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script>
</body></html>
